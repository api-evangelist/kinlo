name: Kinlo
description: 'KINLO is a consumer skincare and suncare brand formulating sun protection and skincare
  products specifically for melanin-rich skin. Co-founded with tennis champion Naomi Osaka, the line
  addresses a market gap in SPF for melanated skin tones, offering dermatologist-tested, tinted, reef-safe
  formulations with ingredients like niacinamide that blend without a white cast. Products are sold direct
  and exclusively through Amazon with Buy with Prime. KINLO is a direct-to-consumer commerce brand with no
  public API, developer portal, SDKs, or programmatic surface; it was surfaced as a portfolio company of
  initialized-capital and added to the API Evangelist network as a consumer-brand profile.'
